# Befund 4d Werkzeug-Analyse 14.8.2026 (offener Punkt A1, BACKLOG-AUDIT-WERKZEUGE-2026-07):
# wöchentliche Abhängigkeits-PRs, klein gehalten — Auto-Merge gilt hier NICHT,
# jede Landung läuft den normalen Weg (Skill landung).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      dev-minor:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
