# ─── «Tore»-Zwilling für reine Doku-Änderungen ────────────────────────────────
# ci.yml ignoriert **.md (paths-ignore) — seit «Tore …» ein Required-Check ist
# (3.7.2026), wären reine .md-PRs sonst PERMANENT unmergbar (Check wird nie
# gemeldet). Dieser Zwilling triggert INVERS (nur **.md) und meldet denselben
# Job-Namen als No-op-Erfolg. GitHub-Standardmuster für required checks + paths.
#
# check:plan LÄUFT HIER TROTZDEM (10.7.2026): reine .md-PRs sind genau die
# Klasse, die @meta-Waisen erzeugt (ROADMAP.md/STRUKTUR.md-Änderungen ohne
# Code) — und das war exakt die Lücke, durch die 3 Waisen grün mergten,
# weil check:plan bislang NIRGENDS in CI lief. Der Schritt bleibt trotzdem
# günstig: nur Node + npm ci + ein vite-node-Skript, kein Build/Playwright.
#
# ERWEITERT 21.7.2026: David setzte am 20.7. sechs Required Checks auf main;
# dieser Zwilling meldete aber nur «Tore …» — die 3 Playwright-Shards und
# «Perf-Budget» wurden bei .md-only-PRs NIE gemeldet, darum hingen reine
# .md-PRs (#318, #320) permanent unmergbar. Deshalb unten je ein No-op-
# Zwilling für die Shard-Kontexte (byte-genaue Job-Namen).
# «Vercel» braucht KEINEN Zwilling — die App-Integration meldet sich selbst.
#
# NACHGEZOGEN 26.7.2026 (CI-Umbau #367): Kontextnamen «Tore (Tests · Lint ·
# Checks)» + Shards 1–8/8. Der Perf-Zwilling BLEIBT, solange «Perf-Budget»
# Required-Kontext ist (Stand 26.7.: David hat ihn behalten): der echte
# perf-Job läuft auf PRs nie mehr (if != pull_request), bei md-only-PRs
# meldet nur dieser Zwilling den Kontext. Zwillinge hier IMMER synchron mit
# ci.yml + Branch-Schutz ändern.
name: CI (Doku-No-op)

on:
  pull_request:
    paths:
      - '**.md'

jobs:
  tore:
    # Job-Name MUSS exakt dem Required-Check-Kontext aus ci.yml entsprechen:
    name: Tore (Tests · Lint · Checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Plan-Inventar-Konsistenz (einziger echter Check im Zwilling)
        run: npm run check:plan
      - run: echo "Reine Doku-Änderung — restliche Code-Tore nicht betroffen (Zwilling meldet grün)."

  # Zwilling der Playwright-Shards aus ci.yml (Job `e2e`): dort triggert der
  # Lauf wegen paths-ignore **.md nie, der Required-Kontext bliebe ungemeldet.
  # Job-Namen MÜSSEN exakt «Browser-Smoke Shard X/8 (Playwright)» ergeben —
  # gleiche Matrix (gruppe: [1..8]) wie in ci.yml.
  e2e:
    name: Browser-Smoke Shard ${{ matrix.gruppe }}/8 (Playwright)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gruppe: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - run: echo "Reine Doku-Änderung — Browser-Smoke Shard ${{ matrix.gruppe }}/8 nicht betroffen, Zwilling meldet grün."

  # Zwilling von `perf` aus ci.yml — nötig, solange «Perf-Budget» Required ist:
  # der echte Job läuft nur noch auf main/merge_group, meldet auf PRs also nie.
  perf:
    name: Perf-Budget (§15 — nur bei grüner Treue)
    runs-on: ubuntu-latest
    steps:
      - run: echo "Reine Doku-Änderung — Perf-Budget nicht betroffen, Zwilling meldet grün."

  # Zwilling des dedizierten «Merge-Schutz (Required-Kontext)»-Jobs aus ci.yml.
  # BEWUSST ein ECHTER Lauf, kein echo-No-op: md-only-Diffs können den Risikopfad
  # `daten/**` treffen (istRisikoPfad matcht das Präfix, nicht die Endung) und
  # das Register selbst ist eine .md — der Zwilling darf diese Klasse nicht
  # stillschweigend grün melden (§6.7b: nie still grün).
  merge-schutz:
    name: Merge-Schutz (Required-Kontext)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Gegenprüfungs-Verdikt auf Risikopfaden (committeter Bereich)
        run: npm run check:merge-schutz
